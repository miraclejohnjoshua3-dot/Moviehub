<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goon - Stream & Watch</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #ff9900;
            --text-color: #ffffff;
            --text-secondary: #b0b0b0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }
        header {
            background-color: var(--card-bg);
            padding: 15px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;
            color: var(--accent-color);
            border-bottom: 1px solid #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 10px;
        }
        /* Search Bar */
        .search-box {
            display: flex;
            margin: 15px 0;
            gap: 8px;
        }
        .search-box input {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #333;
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 16px;
        }
        .search-box button {
            padding: 0 20px;
            background-color: var(--accent-color);
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        /* Video Player Area */
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: none; /* Hidden until a video is selected */
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            display: none;
        }
        .btn {
            flex: 1;
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }
        .btn-secondary {
            background-color: #333;
            color: var(--text-color);
        }
        /* Video List Grid */
        .section-title {
            margin: 20px 0 10px 0;
            font-size: 18px;
            color: var(--text-secondary);
        }
        .video-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .video-card {
            background-color: var(--card-bg);
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid #222;
            transition: transform 0.2s;
        }
        .video-card:hover {
            transform: scale(1.02);
        }
        .thumbnail-placeholder {
            width: 100%;
            height: 105px;
            background-color: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: bold;
        }
        .video-title {
            padding: 8px;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* Ad Banner Placeholder */
        .ad-space {
            margin: 15px 0;
            background-color: var(--card-bg);
            border: 1px dashed #444;
            padding: 12px;
            text-align: center;
            color: var(--text-secondary);
            border-radius: 6px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <header>GOON</header>

    <div class="container">
        <!-- Search Bar -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search videos (e.g., stepmom, POV)..." onkeypress="handleSearch(event)">
            <button onclick="performSearch()">Search</button>
        </div>

        <!-- Ad Network Banner Space (Paste your ExoClick or Adsterra code here) -->
        <div class="ad-space">
            [ Ad Banner Space - Paste Ad Code Here ]
        </div>

        <!-- Active Video Player Section -->
        <div class="video-container" id="playerWrapper">
            <iframe id="videoPlayer" src="" frameborder="0" scrolling="no" allowfullscreen></iframe>
        </div>

        <div class="actions" id="actionButtons">
            <a href="#" id="sourceLink" target="_blank" class="btn">Stream on Source</a>
            <a href="#" class="btn btn-secondary" onclick="alert('To download, use an external downloader or the source link.'); return false;">Download</a>
        </div>

        <!-- Video Catalog Grid -->
        <div class="section-title">Catalog Feed</div>
        <div class="video-grid" id="videoGrid">
            <!-- Video items rendered via JavaScript -->
        </div>
    </div>

    <script>
        // Real active database of sample embed viewkeys from Pornhub
        const videos = [
            { id: "ph56fc59c124c0c", title: "Hot Intensive Scene" },
            { id: "ph60123456789ab", title: "Stepmom Fantasy POV" },
            { id: "ph5c8888888888c", title: "Late Night Compilation" },
            { id: "ph5a11111111114", title: "Casual Couch Encounter" }
        ];

        function renderVideos(list) {
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = "";
            
            if(list.length === 0) {
                grid.innerHTML = "<div style='grid-column: span 2; text-align:center; color:#777; padding:20px;'>No videos found.</div>";
                return;
            }

            list.forEach(video => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.onclick = () => playVideo(video.id, video.title);
                
                card.innerHTML = `
                    <div class="thumbnail-placeholder">▶ PLAY</div>
                    <div class="video-title">${video.title}</div>
                `;
                grid.appendChild(card);
            });
        }

        function playVideo(embedId, title) {
            const playerWrapper = document.getElementById('playerWrapper');
            const videoPlayer = document.getElementById('videoPlayer');
            const actionButtons = document.getElementById('actionButtons');
            const sourceLink = document.getElementById('sourceLink');

            // Load real embed stream
            videoPlayer.src = `https://www.pornhub.com/embed/${embedId}`;
            sourceLink.href = `https://www.pornhub.com/view_video.php?viewkey=${embedId}`;

            // Reveal player components and scroll smoothly to top
            playerWrapper.style.display = 'block';
            actionButtons.style.display = 'flex';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function performSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = videos.filter(v => v.title.toLowerCase().includes(query));
            renderVideos(filtered);
        }

        function handleSearch(e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        }

        // Initialize grid on start
        renderVideos(videos);
    </script>

    <!-- Popunder Ad Script Integration Example -->
    <script>
        // Paste your Popunder/Redirect ad script from your ad network dashboard here
    </script>

</body>
    </html>
